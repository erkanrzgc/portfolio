server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # /privacy istemci tarafında çözülüyor: src/App.tsx doğrudan
    # window.location.pathname'e bakıyor, bir router kütüphanesi yok.
    # Sunucu bu yolda index.html döndürmezse sayfa 404 verir.
    #
    # Bu satır vercel.json'daki rewrite'ın BİREBİR karşılığıdır.
    location = /privacy {
        try_files /index.html =404;
    }

    location / {
        # ⚠ Genel SPA fallback (`... /index.html`) KASTEN YOK.
        #
        # Vercel de yalnızca /privacy'yi yeniden yazıyordu; her bilinmeyen
        # yola index.html döndürmek 200 ile "yumuşak 404" üretir ve arama
        # motorları bunu gerçek sayfa sanar. Canlı bir sitede bu bir
        # gerilemedir. Yeni bir istemci yolu eklenirse BURAYA da eklenmeli.
        try_files $uri $uri/ =404;
    }

    # Vite varlıkları içerik hash'li adlarla üretiyor (app-a1b2c3.js), yani
    # içerik değişince ad da değişir. Bu yüzden sonsuza dek önbelleklenebilir.
    # `expires` KULLANILMIYOR: o direktif de kendi Cache-Control'ünü
    # yazıyor ve add_header ile birlikte İKİ tane Cache-Control başlığı
    # üretiyor (ölçüldü). Tek başlık, belirsizlik bırakmaz.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html'in adı SABİT: önbelleklenirse yeni dağıtım görünmez olur.
    # Varlıklar için doğru olan şey bunun için yanlış.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript
                     application/json image/svg+xml;
}
